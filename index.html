<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Happy Birthday Bujju 🎂✨</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden}
body{background:#08000d;color:#fff;font-family:Georgia,"Times New Roman",serif}
.hidden{display:none!important}

/* ---------- OPENING CANDLE ---------- */
#intro{
  position:fixed;inset:0;z-index:100;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  text-align:center;overflow:hidden;
  background:radial-gradient(circle,#42115f 0%,#140020 48%,#030006 100%);
  transition:opacity .75s,transform .75s;
}
#intro:before{
  content:"";position:absolute;width:420px;height:420px;border-radius:50%;
  background:#ff239d;filter:blur(110px);opacity:.22;
}
.candleScene{position:relative;width:230px;height:440px;z-index:2}
.candle{
  position:absolute;bottom:20px;left:50%;transform:translateX(-50%);
  width:105px;height:285px;border-radius:19px 19px 12px 12px;
  background:linear-gradient(90deg,#bd0b64,#ff5ca8 27%,#fff 48%,#ff8bc2 57%,#c70763);
  box-shadow:inset -15px 0 22px #90004e,inset 13px 0 15px #fff9,0 0 38px #ff37a8;
}
.candle:after{
  content:"";position:absolute;inset:0;border-radius:inherit;
  background:repeating-linear-gradient(135deg,transparent 0 23px,#ffffff28 24px 30px);
}
.candleHighlight{
  position:absolute;z-index:2;left:17px;top:30px;width:13px;height:190px;
  border-radius:20px;background:#fff9;
}
.wick{
  position:absolute;z-index:5;bottom:300px;left:50%;transform:translateX(-50%);
  width:7px;height:30px;border-radius:5px;background:#191018;
}
#flame{
  position:absolute;z-index:10;bottom:321px;left:50%;transform:translateX(-50%);
  width:78px;height:105px;border:0;padding:0;background:transparent;cursor:pointer;
  filter:drop-shadow(0 0 18px #ff8500);
  animation:flameMove .13s infinite alternate;
}
.flameOuter{
  position:absolute;inset:5px;border-radius:60% 40% 60% 40%;
  transform:rotate(45deg);
  background:linear-gradient(135deg,#ff2500,#ff8b00 47%,#ffe94c);
}
.flameInner{
  position:absolute;width:31px;height:48px;left:23px;top:42px;
  border-radius:60% 40% 60% 40%;transform:rotate(45deg);
  background:#fff;box-shadow:0 0 18px #fff;
}
@keyframes flameMove{
  from{transform:translateX(-50%) scale(.94) rotate(-3deg)}
  to{transform:translateX(-50%) scale(1.08) rotate(4deg)}
}
.base{
  position:absolute;bottom:0;left:50%;transform:translateX(-50%);
  width:175px;height:27px;border-radius:50%;
  background:linear-gradient(#fff,#aaa);box-shadow:0 5px 22px #000;
}
#intro h1{
  position:relative;z-index:2;margin:12px 12px 0;
  font-size:clamp(23px,6vw,45px);letter-spacing:4px;
  color:#ffe7a2;text-shadow:0 0 12px #ff36a4,0 0 35px #ff9b00;
  animation:titlePulse 1.3s infinite alternate;
}
#intro p{position:relative;z-index:2;margin:12px 0;color:#eadcff;font-size:17px}
.tapGlow{
  position:absolute;z-index:1;width:105px;height:105px;border:2px solid #fff8;
  border-radius:50%;animation:ring 1.4s infinite;
}
@keyframes ring{0%{transform:scale(.65);opacity:0}35%{opacity:1}100%{transform:scale(1.5);opacity:0}}
@keyframes titlePulse{to{transform:scale(1.035)}}

#party:after{
  content:"";position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(circle at center,transparent 35%,#0007 100%);
  z-index:2;
}
#effects{position:absolute;inset:0;z-index:10;pointer-events:none;overflow:hidden}
.confetti{
  position:absolute;top:-35px;width:9px;height:19px;border-radius:2px;
  box-shadow:0 0 8px currentColor;
  animation:fall linear infinite;
}
@keyframes fall{
  to{transform:translate3d(var(--drift),110vh,0) rotate(900deg)}
}
.spark{
  position:absolute;width:5px;height:5px;border-radius:50%;
  background:#fff;box-shadow:0 0 12px 4px #fff;
  animation:spark 1.5s ease-in-out infinite;
}
@keyframes spark{
  0%,100%{opacity:0;transform:scale(.2)}
  45%{opacity:1;transform:scale(1.5)}
}
.firework{
  position:absolute;width:8px;height:8px;border-radius:50%;
  animation:explode 2.2s ease-out infinite;
}
.firework:before{
  content:"";position:absolute;inset:-105px;border-radius:50%;
  background:repeating-conic-gradient(from 0deg,transparent 0 8deg,#fff 9deg 10deg,transparent 11deg 18deg);
  filter:drop-shadow(0 0 5px #fff);
}
.fw1{left:8%;top:18%;color:#ff62ae}
.fw2{right:9%;top:25%;color:#65edff;animation-delay:.7s}
.fw3{left:47%;top:9%;color:#ffe45c;animation-delay:1.2s}
@keyframes explode{
  0%,100%{transform:scale(.05);opacity:0}
  20%{opacity:1}
  45%{transform:scale(1);opacity:.9}
  65%{transform:scale(.4);opacity:0}
}

/* decorative foreground message, kept subtle so the real cake remains the star */
.message{
  position:absolute;z-index:20;top:6%;left:50%;transform:translateX(-50%);
  width:94%;text-align:center;font-family:"Brush Script MT",cursive;
  font-size:clamp(25px,7vw,52px);font-weight:bold;
  color:#fff4bc;text-shadow:0 0 12px #ff239c,0 3px 5px #000;
  opacity:.94;
}
.message strong{color:#ffe35b}
.wish{
  position:absolute;z-index:20;bottom:3.5%;left:50%;transform:translateX(-50%);
  width:94%;text-align:center;font-size:clamp(14px,3.7vw,21px);
  color:#fff3d0;text-shadow:0 0 10px #ff229a,0 2px 4px #000;
}
.blast{
  position:absolute;z-index:15;font-size:75px;
  animation:blast 1.7s cubic-bezier(.1,.8,.2,1) forwards;
}
.b1{left:6%;top:42%}.b2{right:6%;top:45%}
@keyframes blast{
  0%{transform:scale(.1);opacity:0}
  25%{transform:scale(1.4);opacity:1}
  100%{transform:scale(2.2);opacity:0}
}
#startNotice{
  position:absolute;z-index:30;left:50%;top:50%;transform:translate(-50%,-50%);
  padding:14px 22px;border-radius:30px;background:#0007;border:1px solid #fff7;
  backdrop-filter:blur(6px);font-size:14px;opacity:0;pointer-events:none;
}
@media(max-width:600px){
  .candleScene{transform:scale(.86);margin-bottom:-35px}
  #cakeBackground{background-position:center 42%}
  .message{top:5%}
}
</style>
</head>
<body>

<section id="intro">
  <div class="candleScene">
    <div class="tapGlow"></div>
    <div class="wick"></div>
    <button id="flame" aria-label="Tap the candle flame">
      <span class="flameOuter"></span><span class="flameInner"></span>
    </button>
    <div class="candle"><div class="candleHighlight"></div></div>
    <div class="base"></div>
  </div>
  <h1>TAP THE CANDLE FLAME</h1>
  <p>Tap the flame to start the celebration ✨</p>
</section>

<main id="party" class="hidden">
  <div id="cakeBackground"></div>
  <div id="effects"></div>
  <div class="firework fw1"></div>
  <div class="firework fw2"></div>
  <div class="firework fw3"></div>
  <div class="blast b1">🎉</div>
  <div class="blast b2">🎊</div>
  <div class="message">✨ HAPPY BIRTHDAY <strong>BUJJU</strong> ✨</div>
  <div class="wish">Wishing you endless happiness, love and beautiful moments! 💖</div>
</main>

<audio id="birthdaySong" loop preload="auto">
  <source src="happy-birthday.mp3" type="audio/mpeg">
</audio>

<script>
const intro=document.getElementById("intro");
const flame=document.getElementById("flame");
const party=document.getElementById("party");
const effects=document.getElementById("effects");
const song=document.getElementById("birthdaySong");
let started=false;

function makeConfetti(){
  const symbols=["◆","■","●","★"];
  for(let i=0;i<180;i++){
    const p=document.createElement("span");
    p.className="confetti";
    p.textContent=symbols[Math.floor(Math.random()*symbols.length)];
    p.style.left=Math.random()*100+"vw";
    p.style.color=`hsl(${Math.random()*360},100%,68%)`;
    p.style.fontSize=(8+Math.random()*15)+"px";
    p.style.animationDuration=(3+Math.random()*6)+"s";
    p.style.animationDelay=(-Math.random()*8)+"s";
    p.style.setProperty("--drift",(Math.random()*320-160)+"px");
    effects.appendChild(p);
  }
}
function makeSparks(){
  for(let i=0;i<65;i++){
    const s=document.createElement("span");
    s.className="spark";
    s.style.left=Math.random()*100+"%";
    s.style.top=Math.random()*100+"%";
    s.style.animationDelay=Math.random()*2+"s";
    effects.appendChild(s);
  }
}
function launchBurst(){
  for(let n=0;n<16;n++){
    setTimeout(()=>{
      const b=document.createElement("div");
      b.className="firework";
      b.style.left=(5+Math.random()*90)+"%";
      b.style.top=(8+Math.random()*65)+"%";
      b.style.animationDelay="0s";
      b.style.color=`hsl(${Math.random()*360},100%,70%)`;
      document.getElementById("party").appendChild(b);
      setTimeout(()=>b.remove(),2300);
    },n*280);
  }
}
function startParty(){
  if(started)return;
  started=true;

  // The tap itself is a user gesture, so the browser can normally start audio here.
  song.volume=.78;
  song.play().catch(()=>{});

  intro.style.opacity="0";
  intro.style.transform="scale(1.18)";
  setTimeout(()=>{
    intro.classList.add("hidden");
    party.classList.remove("hidden");
    makeConfetti();
    makeSparks();
    launchBurst();
  },760);
}
flame.addEventListener("click",startParty);
</script>
</body>
</html>
